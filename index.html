<!doctype html>
<html lang="hu" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6c4bcc" />
    <meta name="description" content="Zsebmatek – játékos matekgyakorló 5., 7. és 8. osztályosoknak." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zsebmatek" />
    <title>Zsebmatek</title>
    <script>
      // dark mode before the first paint (no light flash); the app keeps it in sync afterwards
      try {
        if (JSON.parse(localStorage.getItem('matek-kaland:v1') || '{}').settings.theme === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
